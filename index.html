<!DOCTYPE >
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaflet Geometry Management</title>
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="dist/leaflet-geoman.css" />
    <script src="./node_modules/leaflet/dist/leaflet-src.js"></script>
    <!--
            <script src="../../leaflet-measure-path/leaflet-measure-path.js"></script>
        -->
    <!--
            <script src="https://unpkg.com/leaflet.markercluster@1.0.0"></script>
        -->

    <!-- proj4 / Proj4Leaflet are not committed in this repo (cypress/libs
         does not exist). Loading them here only produced SyntaxErrors from
         the dev server fallback, and nothing on the page uses them.
    <script src="cypress/libs/proj4-2.8.0.min.js"></script>
    <script src="cypress/libs/proj4leaflet-1.0.2.min.js"></script>
    -->

    <script type="module">
      import Hand from './node_modules/prosthetic-hand/lib/Hand.js';
      window.Hand = Hand;
    </script>
    <style>
      html,
      body {
        font-family: Arial, Verdana;
        background-color: #eef1ef;
        font-size: 16px;
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .wrapper {
        width: 100%;
        height: 100%;
      }

      #map {
        height: 500px;
      }

      /* the default toolbar (draw + edit + options blocks incl. the Pro
         buttons) and the tile images let the leaflet-container overflow.
         Cypress scrolls overflow ancestors on toolbar clicks, which offsets
         every later coordinate click - `overflow: clip` keeps the container
         unscrollable so the map content stays where the tests expect it */
      .leaflet-container {
        overflow: clip;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <div id="map"></div>
    </div>
    <!--
            <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.js"></script>

        -->
    <script src="dist/leaflet-geoman.js"></script>
  </body>
</html>
